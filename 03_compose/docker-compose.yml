name: fullstack-app

# ─────────────────────────────────────────────────────────────────────────────
#  Full-Stack Application — Docker Compose Example
#  Stack: Node.js API + React Frontend + PostgreSQL + Redis + Nginx
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 🌐 Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/var/www/static:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 🖥️ Frontend (React) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: react_frontend
    environment:
      - REACT_APP_API_URL=/api
    volumes:
      - static_files:/app/build
    networks:
      - frontend
    restart: unless-stopped

  # ── ⚙️ Backend API (Node.js) ─────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: node_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── 🗄️ Database (PostgreSQL) ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # SQL init scripts
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-myapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    shm_size: '256mb'  # Important for PostgreSQL performance

  # ── 🔴 Cache (Redis) ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ── 🔄 Database Migrations ────────────────────────────────────────────────────
  migrations:
    build:
      context: ./api
      target: production
    container_name: db_migrations
    command: ["npm", "run", "migrate"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"   # Run once and exit

  # ── 🛠️ Dev Tools (profiles: dev) ──────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: db_adminer
    ports:
      - "8080:8080"
    networks:
      - backend
    profiles: [dev, tools]
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_ui
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
    ports:
      - "8081:8081"
    networks:
      - backend
    profiles: [dev, tools]

# ─────────────────────────────────────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-myapp}_frontend

  backend:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-myapp}_backend
    internal: false  # Set to true to block external access

# ─────────────────────────────────────────────────────────────────────────────
#  Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-myapp}_pgdata
    driver: local

  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-myapp}_redis
    driver: local

  static_files:
    name: ${COMPOSE_PROJECT_NAME:-myapp}_static
    driver: local
