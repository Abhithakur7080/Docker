function h32(s){let h=5381;for(let i=0;i<s.length;i++)h=Math.imul(h,33)^s.charCodeAt(i);return(h>>>0).toString(16);}
function studentId(u){let h=0;for(let c of u)h=(h*31+c.charCodeAt(0))&0xFFFFFF;return'STU-'+h.toString(16).toUpperCase().padStart(6,'0');}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtSec(s){if(!s||s<=0)return'0m';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?h+'h '+m+'m':m>0?m+'m '+sec+'s':sec+'s';}
function fmtHrs(s){if(!s||s<=0)return'0.0';return(s/3600).toFixed(1);}

function getModStatus(mod,ct){
  const prev=MODULES.find(m=>m.num===mod.num-1);
  const prevOk=!prev||prev.tasks.every(t=>ct?.[t.id]);
  const done=mod.tasks.filter(t=>ct?.[t.id]).length;
  if(!prevOk&&mod.num>1)return'locked';
  if(done===0)return'not_started';
  if(done<mod.tasks.length)return'in_progress';
  return'complete';
}

function getPace(data,session){
  const enrolledAt=data.enrolledAt||session.at;
  const daysElapsed=Math.floor((Date.now()-new Date(enrolledAt).getTime())/86400000);
  const goalWeeks=data.studyGoal||4;
  const totalDays=goalWeeks*7;
  const timePct=totalDays>0?Math.min(daysElapsed/totalDays,1):0;
  const tasksDone=Object.keys(data.completedTasks||{}).length;
  const contentPct=tasksDone/TOTAL_TASKS;
  const ratio=timePct>0.01?contentPct/timePct:(contentPct>0?2:1);
  const expectedDone=Math.round(timePct*TOTAL_TASKS);
  const gap=Math.max(0,expectedDone-tasksDone);
  const completionDate=new Date(new Date(enrolledAt).getTime()+totalDays*86400000);
  let status,color,label,icon;
  if(ratio>=1.15){status='ahead';color='#22c55e';label='Ahead of Schedule';icon='↑';}
  else if(ratio>=0.88){status='on_track';color='#38bdf8';label='On Track';icon='→';}
  else if(ratio>=0.65){status='slightly_behind';color='#f59e0b';label='Slightly Behind';icon='↓';}
  else{status='behind';color='#ef4444';label='Behind Schedule';icon='↓↓';}
  return{status,color,label,icon,daysElapsed,totalDays,goalWeeks,timePct,contentPct,ratio,expectedDone,gap,completionDate,tasksDone};
}

function useUserData(username){
  const[data,setRaw]=useState(()=>username?loadData(username):initData());
  useEffect(()=>{setRaw(username?loadData(username):initData());},[username]);
  const setData=useCallback(fn=>{setRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;if(username)saveData(username,next);return next;});},[username]);
  return[data,setData];
}

/* ═══════════════════════════════════════════════
   MODULE DETAIL (with auto-timer)
═══════════════════════════════════════════════ */
function ModuleDetail({mod,data,setData,onBack,toast,onViewFile}){
  const startTs=useRef(Date.now());
  const[sessElapsed,setSessElapsed]=useState(0);
  const savedTime=data.timeSpent?.[mod.id]||0;
  const[note,setNote]=useState(data.moduleNotes?.[mod.id]||'');
  const autoSaveRef=useRef(null);

  useEffect(()=>{
    setNote(data.moduleNotes?.[mod.id]||'');
    startTs.current=Date.now();
    const tick=setInterval(()=>setSessElapsed(Math.floor((Date.now()-startTs.current)/1000)),1000);
    autoSaveRef.current=setInterval(()=>{
      const sec=Math.floor((Date.now()-startTs.current)/1000);
      if(sec>0){
        setData(prev=>({...prev,timeSpent:{...prev.timeSpent,[mod.id]:(prev.timeSpent?.[mod.id]||0)+sec}}));
        startTs.current=Date.now();
      }
    },30000);
    return()=>{
      clearInterval(tick);clearInterval(autoSaveRef.current);
      const sec=Math.floor((Date.now()-startTs.current)/1000);
      if(sec>0)setData(prev=>({...prev,timeSpent:{...prev.timeSpent,[mod.id]:(prev.timeSpent?.[mod.id]||0)+sec}}));
    };
  },[mod.id]);

  const toggleTask=task=>{
    const was=!!data.completedTasks?.[task.id];
    setData(prev=>{
      const ct={...prev.completedTasks},log=[...(prev.activityLog||[])];
      let xp=prev.totalXp||0,streak=prev.streak||0;
      const today=new Date().toDateString();
      if(!was){
        ct[task.id]={at:new Date().toISOString()};xp+=task.xp;
        const last=prev.lastActivityDate;
        if(last!==today&&last===new Date(Date.now()-86400000).toDateString())streak+=1;
        else if(last!==today)streak=1;
        log.push({date:new Date().toISOString(),taskId:task.id,taskTitle:task.title,moduleId:mod.id,xp:task.xp});
      }else{
        delete ct[task.id];xp=Math.max(0,xp-task.xp);
        const idx=log.map(e=>e.taskId).lastIndexOf(task.id);
        if(idx!==-1)log.splice(idx,1);
      }
      return{...prev,completedTasks:ct,activityLog:log,totalXp:xp,streak,lastActivityDate:!was?today:prev.lastActivityDate};
    });
    if(!was)toast('+'+task.xp+' XP earned','success');
  };

  const saveNote=useCallback(()=>{setData(prev=>({...prev,moduleNotes:{...prev.moduleNotes,[mod.id]:note}}));toast('Notes saved','success');},[note,mod.id]);

  const done=mod.tasks.filter(t=>data.completedTasks?.[t.id]).length;
  const totalXp=mod.tasks.reduce((s,t)=>s+t.xp,0);
  const totalSecs=savedTime+sessElapsed;
  const st=getModStatus(mod,data.completedTasks||{});

  return html`<div className="ai pb-12 max-w-4xl mx-auto px-6">
    <header className="mb-10 text-center pt-8 relative">
      <button onClick=${onBack} className="absolute left-0 top-2 text-[10px] font-semibold text-slate-500 hover:text-sky-400 bg-transparent border border-white/[0.05] hover:bg-white/[0.05] px-3 py-1.5 rounded-full cursor-pointer transition-all">← Back</button>
      <div className="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-3">Module ${String(mod.num).padStart(2,'0')}</div>
      <h1 className="text-3xl font-black mb-4">${mod.title}</h1>
      <p className="text-slate-400 text-sm leading-relaxed">${mod.desc}</p>
      <div className="flex items-center justify-center gap-4 mt-6 text-xs font-semibold text-slate-500">
        <span className="flex items-center gap-1.5">⏱️ ~${mod.hours}h recommended</span>
        <span className="flex items-center gap-1.5">🎯 ${totalXp} XP available</span>
        <${StatusBadge} status=${st}/>
      </div>
    </header>

    <article className="prose prose-invert prose-sky max-w-none mb-16 bg-[#0a1020] border border-white/[0.05] rounded-2xl p-8 shadow-2xl">
      ${mod.files.map(f=>html`
        <div key=${f} className="mb-12 last:mb-0">
          <div dangerouslySetInnerHTML=${{__html: window.marked ? marked.parse(window.COURSE_CONTENT?.[mod.id+'/'+f] || '') : ''}} />
        </div>
      `)}
    </article>

    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div className="bg-[#0a1020] border border-white/[0.05] rounded-xl p-6 shadow-xl">
        <h3 className="text-sm font-bold mb-4 flex items-center justify-between">
          <span>Action Items</span>
          <span className="text-[10px] font-mono text-sky-400 bg-sky-500/10 px-2 py-1 rounded">${done}/${mod.tasks.length} Completed</span>
        </h3>
        <div className="space-y-2">
          ${mod.tasks.map((task,ti)=>{
            const isDone=!!data.completedTasks?.[task.id];
            return html`<div key=${task.id} className="flex items-start gap-3 p-3 border border-white/[0.04] rounded-lg transition-all hover:bg-white/[0.02]">
              <div onClick=${()=>toggleTask(task)} className=${cx('mt-0.5 w-4 h-4 rounded cursor-pointer flex items-center justify-center transition-all border',isDone?'bg-sky-500 border-sky-500':'bg-transparent border-white/20 hover:border-sky-400')}>
                ${isDone&&html`<${Check}/>`}
              </div>
              <div className="flex-1">
                <div className=${cx('text-sm font-medium mb-1',isDone?'line-through text-slate-600':'text-slate-200')}>${task.title}</div>
                <div className="text-xs text-slate-500 leading-relaxed">${task.desc}</div>
              </div>
              <span className="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-2 py-1 rounded">+${task.xp}</span>
            </div>`;
          })}
        </div>
      </div>
      
      <div className="bg-[#0a1020] border border-white/[0.05] rounded-xl p-6 shadow-xl flex flex-col">
        <h3 className="text-sm font-bold mb-4 flex items-center justify-between">
          <span>Study Session Notes</span>
          <span className="text-[10px] text-slate-500 font-mono">⏱️ ${fmtSec(totalSecs)}</span>
        </h3>
        <textarea rows=${8} value=${note} onInput=${e=>setNote(e.target.value)} onBlur=${saveNote} className="w-full flex-1 bg-white/[0.03] border border-white/[0.05] rounded-lg p-4 text-xs font-mono text-slate-300 outline-none focus:border-sky-500/50 resize-none placeholder:text-slate-700" placeholder="Jot down notes while reading..." />
        <div className="text-[9px] text-slate-600 mt-3 flex justify-between">
          <span>Saves automatically.</span>
          <span>Time is tracked automatically.</span>
        </div>
      </div>
    </div>
  </div>`;
}

            {l:'Tasks Done',v:done.length+'/'+TOTAL_TASKS,c:'#22c55e'},
            {l:'XP Score',v:totalXp+'/'+MAX_XP,c:'#f59e0b'},
            {l:'Hours Logged',v:fmtHrs(totalSecs)+'h',c:'#a855f7'},
            {l:'Day Streak',v:(data.streak||0)+' days',c:'#f97316'},
          ].map((s,i)=>html`
            <div key=${i} className="bg-white/[0.03] border border-white/[0.06] rounded-lg p-3 text-center">
              <div className="text-[9px] text-slate-600 uppercase tracking-wider mb-1">${s.l}</div>
              <div className="text-lg font-black" style=${{color:s.c}}>${s.v}</div>
            </div>`)}
        </div>
      </div>

      <!-- Module Report Table -->
      <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl overflow-hidden mb-5">
        <div className="px-5 py-3.5 border-b border-white/[0.06]">
          <div className="text-xs font-bold">Module Progress Report</div>
        </div>
        <div className="overflow-x-auto">
          <table>
            <thead>
              <tr className="border-b border-white/[0.06]">
                ${['#','Module','Status','Tasks','XP','Time Logged','Compliance','Progress'].map(h=>html`
                  <th key=${h} className="px-4 py-2.5 text-[9px] font-bold text-slate-600 uppercase tracking-wider text-left">${h}</th>`)}
              </tr>
            </thead>
            <tbody>
              ${modStats.map((m,i)=>html`
                <tr key=${m.id} className="border-b border-white/[0.04] hover:bg-white/[0.02] transition-colors">
                  <td className="px-4 py-3 text-xs font-mono text-slate-600">${String(m.num).padStart(2,'0')}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <span style=${{fontSize:14}}>${m.emoji}</span>
                      <span className="text-xs font-medium">${m.title}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3"><${StatusBadge} status=${m.st}/></td>
                  <td className="px-4 py-3 text-xs font-mono">${m.done}/${m.tasks.length}</td>
                  <td className="px-4 py-3 text-xs font-mono text-amber-400">${m.tasks.filter(t=>ct[t.id]).reduce((s,t)=>s+t.xp,0)}</td>
                  <td className="px-4 py-3 text-xs font-mono">${fmtHrs(m.secs)}h</td>
                  <td className="px-4 py-3">
                    <span className="text-xs font-bold" style=${{color:m.compliance>=80?'#22c55e':m.compliance>=50?'#f59e0b':'#64748b'}}>${m.compliance}%</span>
                  </td>
                  <td className="px-4 py-3" style=${{minWidth:100}}>
                    <div style=${{height:4,background:'rgba(255,255,255,0.07)',borderRadius:2,overflow:'hidden'}}>
                      <div style=${{height:'100%',width:m.pct+'%',background:m.accent,borderRadius:2}}/>
                    </div>
                  </td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-4 mb-5">
        <!-- Task Breakdown -->
        <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl p-5">
          <div className="text-xs font-bold mb-4">Task Completion by Type</div>
          ${Object.entries(bd).map(([type,count])=>{
            const cfg=TC[type]||{c:'#64748b',l:type};
            const total=ALL_TASKS.filter(t=>t.type===type).length;
            const p=Math.round((count/total)*100);
            return html`<div key=${type} className="mb-4 last:mb-0">
              <div className="flex justify-between text-xs mb-1.5">
                <div className="flex items-center gap-2">
                  <div style=${{width:8,height:8,borderRadius:2,background:cfg.c}}/>
                  <span className="font-medium capitalize">${type}</span>
                </div>
                <span className="text-slate-500 font-mono">${count}/${total} (${p}%)</span>
              </div>
              <${ProgBar} pct=${p} color=${cfg.c} h=${5}/>
            </div>`;
          })}
        </div>

        <!-- Pace Analysis -->
        <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl p-5">
          <div className="text-xs font-bold mb-4">Pace Analysis</div>
          <div className="space-y-3">
            ${[
              {l:'Days Elapsed',v:pace.daysElapsed+' / '+pace.totalDays},
              {l:'Timeline Progress',v:Math.round(pace.timePct*100)+'%'},
              {l:'Content Progress',v:Math.round(pace.contentPct*100)+'%'},
              {l:'Pace Ratio',v:pace.ratio.toFixed(2)+'× '+(pace.ratio>=1?'↑':'↓')},
              {l:'Tasks Expected by Now',v:pace.expectedDone},
              {l:'Tasks Completed',v:done.length},
              {l:'Gap',v:pace.gap>0?'-'+pace.gap+' tasks':'On target ✓',c:pace.gap>0?'#ef4444':'#22c55e'},
            ].map((s,i)=>html`
              <div key=${i} className="flex justify-between text-xs border-b border-white/[0.04] pb-2 last:border-0 last:pb-0">
                <span className="text-slate-500">${s.l}</span>
                <span className="font-semibold font-mono" style=${s.c?{color:s.c}:{}}>${s.v}</span>
              </div>`)}
          </div>
        </div>
      </div>

      <!-- Achievements -->
      <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <div className="text-xs font-bold">Achievement Record</div>
          <span className="text-[10px] text-slate-600">${earned.length} / ${ACHIEVEMENTS.length} earned</span>
        </div>
        <div className="grid gap-2.5" style=${{gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))'}}>
          ${ACHIEVEMENTS.map(a=>{
            const e=a.fn(data);
            return html`<div key=${a.id} className=${cx('border rounded-xl p-3.5 transition-all',e?'bg-white/[0.03] border-white/[0.1]':'border-white/[0.04]')} style=${!e?{opacity:.3,filter:'grayscale(0.8)'}:{}}>
              <div className="flex items-center gap-2 mb-1.5">
                <span style=${{fontSize:18}}>${a.emoji}</span>
                <span className="text-xs font-bold">${a.name}</span>
              </div>
              <div className="text-[10px] text-slate-600 leading-snug">${a.desc}</div>
              ${e&&html`<div className="text-[9px] font-bold text-sky-400 mt-2 uppercase tracking-wider">AWARDED ✓</div>`}
            </div>`;
          })}
        </div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   NOTES
═══════════════════════════════════════════════ */
function Notes({data,setData,toast}){
  const ct=data.completedTasks||{};
  const[sel,setSel]=useState(MODULES[0].id);
  const mod=MODULES.find(m=>m.id===sel);
  const[note,setNote]=useState(data.moduleNotes?.[sel]||'');
  const debounceRef=useRef(null);

  useEffect(()=>setNote(data.moduleNotes?.[sel]||''),[sel,data.moduleNotes]);

  const handleChange=v=>{
    setNote(v);
    clearTimeout(debounceRef.current);
    debounceRef.current=setTimeout(()=>{
      setData(prev=>({...prev,moduleNotes:{...prev.moduleNotes,[sel]:v}}));
    },800);
  };

  const save=()=>{setData(prev=>({...prev,moduleNotes:{...prev.moduleNotes,[sel]:note}}));toast('Notes saved','success');};
  const hasNote=id=>(data.moduleNotes?.[id]||'').length>10;
  const st=id=>getModStatus(MODULES.find(m=>m.id===id),ct);

  return html`<div className="ai h-full overflow-y-auto">
    <div className="px-7 pt-6 pb-0 mb-5">
      <h1 className="text-xl font-black mb-0.5">📝 Study Notes</h1>
      <p className="text-slate-500 text-xs">Module-by-module notes · Auto-saved as you type</p>
    </div>
    <div className="px-7 pb-7 flex gap-5">
      <!-- Module List -->
      <div className="w-48 flex-shrink-0">
        <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl overflow-hidden">
          ${MODULES.map(m=>{
            const locked=st(m.id)==='locked';
            return html`<button key=${m.id} onClick=${()=>!locked&&setSel(m.id)} disabled=${locked}
              className=${cx('flex items-center gap-2 px-3.5 py-2.5 w-full text-left border-b border-white/[0.04] last:border-0 transition-all',
                sel===m.id?'bg-sky-500/10':'bg-transparent',
                locked?'opacity-35 cursor-not-allowed':'cursor-pointer hover:bg-white/[0.03]')}>
              <span style=${{fontSize:13}}>${m.emoji}</span>
              <div className="flex-1 min-w-0">
                <div className=${cx('text-xs font-medium truncate',sel===m.id?'text-sky-400':'text-slate-400')}>${m.title.length>14?m.title.slice(0,14)+'…':m.title}</div>
                ${locked?html`<div className="text-[9px] text-slate-700">🔒 Locked</div>`:html`<div className="text-[9px] text-slate-700">${hasNote(m.id)?'● Notes saved':'No notes yet'}</div>`}
              </div>
            </button>`;
          })}
        </div>
      </div>

      <!-- Editor -->
      <div className="flex-1">
        <div className="bg-white/[0.025] border border-white/[0.07] rounded-xl p-5">
          <div className="flex items-start justify-between mb-4">
            <div>
              <div className="text-sm font-bold">${mod.emoji} ${mod.title}</div>
              <div className="text-xs text-slate-600 mt-0.5">${mod.desc}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-700">Auto-saves</span>
              <button onClick=${save}
                className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-bold rounded cursor-pointer border-none transition-all">Save Now</button>
            </div>
          </div>
          <textarea rows=${22} value=${note} onInput=${e=>handleChange(e.target.value)}
            placeholder=${'Notes for '+mod.title+'...\n\nSuggested structure:\n──────────────────\n📌 Key Concepts\n• \n\n💻 Commands Practiced\n$ \n\n🔍 Things to Follow Up\n• \n\n💡 Personal Insights\n• '}
            className="w-full px-4 py-3.5 bg-white/[0.03] border border-white/[0.07] rounded-lg text-slate-200 text-xs font-mono leading-relaxed resize-y outline-none transition-all focus:border-sky-500/50 focus:ring-1 focus:ring-sky-500/20 placeholder:text-slate-700"/>
          <div className="flex items-center justify-between mt-2.5 text-[10px] text-slate-700">
            <span>${note.length} characters</span>
            ${note.length>0&&html`<button onClick=${()=>handleChange('')} className="text-slate-700 hover:text-red-400 bg-transparent border-none cursor-pointer transition-colors">Clear notes</button>`}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════ */
function App(){
  const[session,setSession]=useState(()=>getSession());
  const[view,setView]=useState('dashboard');
  const[selMod,setSelMod]=useState(null);
  const[toastState,setToastState]=useState(null);
  const[viewFile,setViewFile]=useState(null);
  const[data,setData]=useUserData(session?.username);

  // Set enrollment date on first login
  useEffect(()=>{
    if(session&&!data.enrolledAt){
      setData(prev=>({...prev,enrolledAt:session.at||new Date().toISOString(),studyGoal:session.studyGoal||4}));
    }
  },[session]);

  const toast=useCallback((msg,type='success')=>setToastState({msg,type,k:Date.now()}),[]);
  const logout=()=>{clearSession();setSession(null);setView('dashboard');setSelMod(null);};
  const totalXp=useMemo(()=>ALL_TASKS.filter(t=>data.completedTasks?.[t.id]).reduce((s,t)=>s+t.xp,0),[data.completedTasks]);

  const goView=useCallback(v=>{setView(v);if(v!=='module-detail')setSelMod(null);},[]);
  const goModules=useCallback(mod=>{if(mod&&typeof mod==='object'){setSelMod(mod);setView('module-detail');}else{setView('modules');setSelMod(null);}  },[]);

  if(!session)return html`<${AuthScreen} onAuth=${s=>{saveSession(s);setSession(s);}}/>`;

  const renderView=()=>{
    switch(view){
      case'dashboard':return html`<${Dashboard} data=${data} session=${session} goModules=${goModules} setView=${setView}/>`;
      case'modules':return html`<${ModulesList} data=${data} onSelect=${mod=>{setSelMod(mod);setView('module-detail');}}/>`;
      case'module-detail':return selMod
        ?html`<${ModuleDetail} mod=${selMod} data=${data} setData=${setData} onBack=${()=>{setSelMod(null);setView('modules');}} toast=${toast} onViewFile=${(mId,f)=>setViewFile({modId:mId,f})}/>`
        :html`<${ModulesList} data=${data} onSelect=${mod=>{setSelMod(mod);setView('module-detail');}}/>`;
      case'practice':return html`<${PracticePlan}/>`;
      case'reports':return html`<${Reports} data=${data} session=${session}/>`;
      case'notes':return html`<${Notes} data=${data} setData=${setData} toast=${toast}/>`;
      default:return html`<${Dashboard} data=${data} session=${session} goModules=${goModules} setView=${setView}/>`;
    }
  };

  return html`<div className="flex flex-col h-full overflow-hidden bg-[#060b16] text-slate-200">
    <${Navbar} view=${view} setView=${goView} session=${session} data=${data} totalXp=${totalXp} onLogout=${logout}/>
    <main className="flex-1 overflow-y-auto overflow-x-hidden">
      ${renderView()}
    </main>
    ${toastState&&html`<${Toast} key=${toastState.k} message=${toastState.msg} type=${toastState.type} onDone=${()=>setToastState(null)}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
