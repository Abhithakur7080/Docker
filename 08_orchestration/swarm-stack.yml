# ─────────────────────────────────────────────────────────────────────────────
#  Docker Swarm Stack — Production Deployment
#  Deploy with: docker stack deploy -c swarm-stack.yml myapp
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"   # Required for Swarm mode deploy keys

services:

  # ── Nginx Load Balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress           # Swarm routing mesh — all nodes receive!
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    secrets:
      - ssl_cert
      - ssl_key
    networks:
      - webnet
    deploy:
      mode: replicated
      replicas: 2               # 2 nginx instances
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Application (scaled across nodes) ───────────────────────────────────
  app:
    image: ${REGISTRY}/myapp:${TAG:-latest}
    environment:
      NODE_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
    secrets:
      - db_password
      - jwt_secret
    networks:
      - webnet
      - backend
    deploy:
      mode: replicated
      replicas: 3               # 3 app instances across nodes
      update_config:
        parallelism: 1          # Update one at a time (rolling)
        delay: 30s
        monitor: 60s
        failure_action: rollback
        order: start-first      # New version starts before old stops
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "prometheus.io/scrape=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL (single instance with volume) ─────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.db == true   # Only on nodes labeled 'db=true'
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Visualizer (Swarm management UI) ────────────────────────────────────
  visualizer:
    image: dockersamples/visualizer:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager    # Only on manager node
      replicas: 1
    networks:
      - webnet

# ─────────────────────────────────────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  webnet:
    driver: overlay
    attachable: true

  backend:
    driver: overlay
    internal: true

# ─────────────────────────────────────────────────────────────────────────────
#  Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

  redis_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
#  Configs (distributed across Swarm)
# ─────────────────────────────────────────────────────────────────────────────
configs:
  nginx_config:
    file: ./nginx/nginx.conf

# ─────────────────────────────────────────────────────────────────────────────
#  Secrets (encrypted, distributed across Swarm)
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  db_password:
    external: true              # Created with: docker secret create
  jwt_secret:
    external: true
  ssl_cert:
    external: true
  ssl_key:
    external: true
