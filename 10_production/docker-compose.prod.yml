name: production-stack

# ─────────────────────────────────────────────────────────────────────────────
#  🏆 Production Docker Compose Stack
#  Includes: App + DB + Redis + Nginx + SSL + Monitoring
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: "service"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

x-deploy-defaults: &deploy-defaults
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

services:

  # ── 🌐 Nginx (Reverse Proxy + SSL Termination) ─────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: prod_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - static_files:/var/www/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "nginx", "-t"]
    logging: *default-logging
    labels:
      com.myapp.service: nginx
      com.myapp.env: production

  # ── 🔐 Certbot (SSL Certificate Renewal) ───────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: prod_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - public
    restart: unless-stopped
    logging: *default-logging

  # ── ⚙️ Application ──────────────────────────────────────────────────────────
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: prod_app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      LOG_LEVEL: info
    secrets:
      - db_password
      - jwt_secret
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      <<: *deploy-defaults
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    labels:
      com.myapp.service: app
      com.myapp.env: production

  # ── 🗄️ PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: prod_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    shm_size: '256mb'
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    labels:
      com.myapp.service: db
      com.myapp.env: production

  # ── 🔴 Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── 🔄 Database Migrations (run-once) ──────────────────────────────────────
  migrations:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: prod_migrations
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    logging: *default-logging

  # ── 📊 Prometheus (Metrics) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prod_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    profiles: [monitoring]
    logging: *default-logging

  # ── 📈 Grafana (Dashboards) ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: prod_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitoring.myapp.com
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"   # Only localhost!
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped
    profiles: [monitoring]
    logging: *default-logging

  # ── 📦 Backup (scheduled) ──────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: prod_backup
    entrypoint: >
      /bin/sh -c "
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          pg_dump -h db -U $$POSTGRES_USER $$POSTGRES_DB
            | gzip > /backups/backup_$$TIMESTAMP.sql.gz;
          find /backups -name '*.sql.gz' -mtime +7 -delete;
          echo \"Backup completed at $$TIMESTAMP\";
          sleep 86400;
        done"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    profiles: [backup]
    logging: *default-logging

# ─────────────────────────────────────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  public:
    driver: bridge
    name: prod_public

  backend:
    driver: bridge
    name: prod_backend
    internal: false

  monitoring:
    driver: bridge
    name: prod_monitoring

# ─────────────────────────────────────────────────────────────────────────────
#  Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: prod_pgdata
    driver: local

  redis_data:
    name: prod_redis_data
    driver: local

  static_files:
    name: prod_static
    driver: local

  uploads:
    name: prod_uploads
    driver: local

  certbot_certs:
    name: prod_certbot_certs
    driver: local

  certbot_webroot:
    name: prod_certbot_webroot
    driver: local

  prometheus_data:
    name: prod_prometheus_data
    driver: local

  grafana_data:
    name: prod_grafana_data
    driver: local

  backups:
    name: prod_backups
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
#  Secrets
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  db_password:
    file: ./secrets/db_password.txt

  jwt_secret:
    file: ./secrets/jwt_secret.txt

  grafana_password:
    file: ./secrets/grafana_password.txt
